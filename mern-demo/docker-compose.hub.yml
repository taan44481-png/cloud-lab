services:
  backend:
    image: an237344/mern-backend:1.0
    container_name: mern-backend-codespaces
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 5000

  frontend:
    image: an237344/mern-frontend:2.0
    container_name: mern-frontend-codespaces
    ports:
      - "3000:3000"
    depends_on:
      - backend
